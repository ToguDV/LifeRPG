<!doctype html>
<html lang="es" data-theme="pergamino" data-paper="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Códice de Componentes — LifeRPG UI</title>
    <meta
      name="description"
      content="Galería de componentes React para una aplicación de tareas con estética de diario de invierno y ocho paletas."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23111310'/%3E%3Cpath d='M16 4c1.1 6.7 5.2 10.8 12 12-6.8 1.2-10.9 5.3-12 12-1.1-6.7-5.2-10.8-12-12 6.8-1.2 10.9-5.3 12-12Z' fill='%23c1b69a'/%3E%3C/svg%3E"
    />
    <script>
      // Apply the saved palette before first paint to avoid a flash of parchment.
      try {
        var key = localStorage.getItem('liferpg-ui-theme')
        var allowed = ['pergamino', 'chalk', 'catppuccin', 'dracula', 'nord', 'gruvbox', 'rosepine', 'tokyonight']
        if (allowed.indexOf(key) !== -1) {
          document.documentElement.setAttribute('data-theme', key)
          document.documentElement.setAttribute('data-paper', key === 'pergamino' ? 'light' : 'dark')
        }
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
